<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus // Analytics Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .badge {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 700px) {
            .grid-stats {
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
        }

        .stat-card span {
            font-size: 13px;
            color: #64748b;
        }

        .stat-card h2 {
            font-size: 28px;
            margin-top: 8px;
            color: #0f172a;
        }

        .action-row {
            display: flex;
            gap: 12px;
        }

        .btn-main {
            background: #0f172a;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-main:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header">
            <h1>Nexus Control Panel</h1>
            <div class="badge">Active Node</div>
        </div>

        <div class="grid-stats">
            <div class="stat-card">
                <span>Общий трафик</span>
                <h2>128,400</h2>
            </div>
            <div class="stat-card">
                <span>Конверсия</span>
                <h2>4.8%</h2>
            </div>
            <div class="stat-card">
                <span>Статус системы</span>
                <h2>99.9%</h2>
            </div>
        </div>

        <div class="action-row">
            <button class="btn-main">Синхронизировать данные</button>
        </div>
    </div>

</body>
</html>
